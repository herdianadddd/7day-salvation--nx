name: Build 7 Days Salvation NX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make folders
        run: mkdir -p out/switch/7DaysSalvation
      - name: Get EKA2L1 Switch
        run: |
          cd out/switch/7DaysSalvation
          wget https://github.com/EKA2L1/EKA2L1/releases/download/0.0.9/eka2l1-v0.0.9-switch.zip -O eka.zip || wget https://github.com/EKA2L1/EKA2L1/releases/download/continous/eka2l1-switch.zip -O eka.zip || true
          if [ -f eka.zip ]; then unzip -o eka.zip; rm eka.zip; else echo "No zip, creating dummy"; echo "Put EKA2L1 files here" > readme.txt; fi
          ls -lh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 7DaysSalvation-NX
          path: out/
