name: Build 7 Days Salvation NX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install gdown
          mkdir -p out/switch/7DaysSalvation
          gdown --id 1saj5Sy6G1RfzGj4P0RIJQ1XOkAGEGDCd -O out/switch/7DaysSalvation/7Days.sis
          ls -lh out/switch/7DaysSalvation/
      - run: |
          cd out/switch/7DaysSalvation
          wget -q https://github.com/EKA2L1/EKA2L1/releases/download/0.0.9/eka2l1-v0.0.9-switch.zip -O eka.zip
          unzip -o eka.zip
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: 7DaysSalvation-NX
          path: out/
