name: Build 7 Days Salvation NX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip install gdown
      - name: Download SIS from Drive
        run: |
          mkdir -p out/switch/7DaysSalvation
          gdown --fuzzy "https://drive.google.com/file/d/1saj5Sy6G1RfzGj4P0RIJQ1XOkAGEGDCd/view?usp=drivesdk" -O out/switch/7DaysSalvation/7Days.sis
          ls -lh out/switch/7DaysSalvation/
      - name: Download EKA2L1 Switch
        run: |
          cd out/switch/7DaysSalvation
          wget -q https://github.com/EKA2L1/EKA2L1/releases/download/0.0.9/eka2l1-v0.0.9-switch.zip
          unzip -o eka2l1-v0.0.9-switch.zip
          rm eka2l1-v0.0.9-switch.zip
          ls -lh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 7DaysSalvation-NX
          path: out/
