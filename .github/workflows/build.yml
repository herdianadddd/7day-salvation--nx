name: Build 7 Days Salvation NX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out/switch/7DaysSalvation
      - run: |
          echo "Place your 7Days.sis here" > out/switch/7DaysSalvation/README.txt
          echo "Put EKA2L1 Switch files here too" >> out/switch/7DaysSalvation/README.txt
          ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: 7DaysSalvation-NX
          path: out/
