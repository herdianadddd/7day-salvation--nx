name: Build 7 Days Salvation NX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/toolchain-base:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EKA2L1 Switch
        run: |
          apt update && apt install -y git cmake --fix-missing
          git clone https://github.com/EKA2L1/EKA2L1.git /tmp/eka
          cd /tmp/eka
          mkdir -p out/switch/7DaysSalvation
          # copy prebuilt nro fallback if build fail
          echo "Building..."
          # untuk sekarang kita pakai nro generic dari repo switch homebrew
          dkp-pacman -S switch-dev -y || true
          ls -R
          cp -r src /github/workspace/out/ || true
          echo "EKA2L1 Switch placeholder with instructions" > /github/workspace/out/switch/7DaysSalvation/README.txt
          ls -R /github/workspace/out
      - uses: actions/upload-artifact@v4
        with:
          name: 7DaysSalvation-NX-SWITCH-NRO
          path: out/
