name: Build 7 Days Salvation NX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y jq unzip wget curl -y
          mkdir -p eka_tmp out/switch/7DaysSalvation
          API="https://api.github.com/repos/EKA2L1/EKA2L1/releases/tags/continous"
          curl -sL $API -o rel.json
          echo "=== ALL ASSETS ==="
          cat rel.json | jq -r '.assets[].name'
          URL=$(jq -r '.assets[] | select(.name | test("switch"; "i")) | select(.name | test("\\.zip$"; "i")) | .browser_download_url' rel.json | head -n1)
          echo "SWITCH ZIP URL: $URL"
          wget -L "$URL" -O eka.zip
          unzip -l eka.zip | head -n 50
          unzip -o eka.zip -d eka_tmp
          find eka_tmp -type f | head -n 50
          # copy nro dan semua ke out
          find eka_tmp -name "*.nro" -exec cp -v {} out/switch/ \;
          find eka_tmp -type d -name "7DaysSalvation" -exec cp -rv {} out/switch/ \; || true
          cp -r eka_tmp/* out/switch/ || true
          ls -R out | head -n 100
      - uses: actions/upload-artifact@v4
        with:
          name: 7DaysSalvation-NX-SWITCH
          path: out/
