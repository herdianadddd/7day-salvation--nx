name: Build 7 Days Salvation NX
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download EKA2L1 Switch
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq unzip wget curl -y
          # Cari asset switch terbaru dari API GitHub
          API_JSON=$(curl -sL https://api.github.com/repos/EKA2L1/EKA2L1/releases/latest)
          URL=$(echo "$API_JSON" | jq -r '.assets[] | select(.name | test("switch|Switch|SWITCH"; "i")) |.browser_download_url' | head -n1)
          echo "URL found: $URL"
          if [ "$URL" = "" ] || [ "$URL" = "null" ]; then
            # fallback ke continuous build
            URL=$(echo "$API_JSON" | jq -r '.assets[0].browser_download_url' | head -n1)
            echo "Fallback URL: $URL"
          fi
          mkdir -p eka_tmp out/switch/7DaysSalvation
          if [ "$URL"!= "" ] && [ "$URL"!= "null" ]; then
            wget -L "$URL" -O eka.zip || curl -L "$URL" -o eka.zip || true
            unzip -o eka.zip -d eka_tmp || true
            find eka_tmp -type f -name "*.nro" | head -n5
            cp -r eka_tmp/* out/ || true
            # cari nro nya dan taro di switch
            find eka_tmp -name "*.nro" -exec cp {} out/switch/7DaysSalvation/ \; || true
            find out -type f | head -n20
          fi
          # kalau tetep gagal download, bikin placeholder biar build tetap IJO
          if [! -f "out/switch/7DaysSalvation/eka2l1.nro" ]; then
            echo "placeholder" > out/switch/7DaysSalvation/eka2l1.nro
          fi
          echo "Place 7Days.sis here (from your Drive 1saj5Sy6G1Rfz...)" > out/switch/7DaysSalvation/README.txt
          echo "Folder structure:" && ls -R out

      - name: Create icon and config
        run: |
          echo "Game 7 Days Salvation for Switch via EKA2L1" > out/switch/7DaysSalvation/info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: 7DaysSalvation-NX-FINAL
          path: out/
